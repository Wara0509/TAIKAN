<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAIKAN | 服装戦略提案アプリ</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="container">
      <h1>TAIKAN</h1>
      <p>天気表示ではなく、<strong>服装の意思決定を代替する</strong>ための戦略アプリ</p>
    </header>

    <main class="container grid">
      <section class="card">
        <h2>共通入力</h2>
        <div class="fields">
          <label>地域名 <input id="location" value="Tokyo" /></label>
          <label>日付 <input id="date" type="date" value="2026-04-08" /></label>
          <label>天気 <input id="weather" value="Cloudy" /></label>
          <label>気温(℃) <input id="temp" type="number" step="0.1" value="18" /></label>
          <label>風速(m/s) <input id="wind" type="number" step="0.1" value="5" /></label>
        </div>
      </section>

      <section class="card">
        <h2>① 即決モード</h2>
        <p>数秒で戦略を決める</p>
        <button id="quickRun">即決で判定する</button>
        <div id="quickOutput" class="resultBox"></div>
      </section>

      <section class="card wide">
        <h2>② 精密モード（3ステップ）</h2>
        <div class="stepper">
          <div class="step active" data-step="1">STEP1 環境</div>
          <div class="step" data-step="2">STEP2 移動</div>
          <div class="step" data-step="3">STEP3 時間変化</div>
        </div>

        <div id="step1" class="stepPanel active">
          <h3>環境（複数選択可）</h3>
          <div class="chips" id="envChips"></div>
          <button class="next" data-next="2">次へ</button>
        </div>

        <div id="step2" class="stepPanel">
          <h3>移動（1つ選択）</h3>
          <div class="radioGroup" id="moveRadios"></div>
          <div class="row"><button class="prev" data-prev="1">戻る</button><button class="next" data-next="3">次へ</button></div>
        </div>

        <div id="step3" class="stepPanel">
          <h3>時間変化（複数選択可）</h3>
          <div class="chips" id="timeChips"></div>
          <div class="row"><button class="prev" data-prev="2">戻る</button><button id="preciseRun">結果を表示</button></div>
        </div>
      </section>

      <section class="card wide">
        <h2>③ 結果画面</h2>
        <div id="result" class="resultBox muted">精密モードで「結果を表示」を押すとここに表示されます。</div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
